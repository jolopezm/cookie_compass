<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li><strong>🧭 COMPASS</strong></li>
      </ul>
      <ul>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Products</a></li>
      </ul>
    </nav>

    <select
      name="selector-tabla"
      aria-label="Seleccionar tabla"
      required
      id="selector-tabla"
    >
      <option selected disabled value="">Seleccione la tabla a mostrar</option>
      <option value="clientes">Clientes</option>
      <option value="productos">Productos</option>
      <option value="ordenes">Órdenes</option>
    </select>

    <section id="contenedor-tabla"></section>

    <section id="bottom-sheet" class="sheet">
      <button id="btn-cerrar" class="close-btn">
        ⨯
      </button>

      <div class="sheet-content">
        <h2>Nueva orden</h2>
        <form id="formulario-orden">
          <label for="selector-cliente">Cliente:</label>
          <select id="selector-cliente" name="cliente" required></select>

          <fieldset>
            <legend>Productos:</legend>
            <div id="productos-container"></div>
            <div class="grid">
                <label>
                    <input type="checkbox" value="galletas" id="checkbox-galleta"/> Galletas 🍪
                </label>
                <input type="number" name="number" placeholder="Cantidad" aria-label="Number" value="0" id="cantidad-galleta" disabled>
            </div>
            <div class="grid">
                <label>
                    <input type="checkbox" value="queques" id="checkbox-queque"/> Queques 🍰
                </label>
                <input type="number" name="number" placeholder="Cantidad" aria-label="Number" value="0" id="cantidad-queque" disabled>
            </div>

          </fieldset>

          <button type="submit" id="btn-guardar">Crear orden</button>
      </div>
    </section>

    <button id="btn-abrir">Nueva orden</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
