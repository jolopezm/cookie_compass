<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Cookie Compass - Gestión</title>
    <meta name="description" content="Sistema de gestión Cookie Compass" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body class="container">
    <div id="auth-container" hidden>
      <login-form></login-form>
    </div>

    <main id="app-content" hidden>
      <nav>
        <ul>
          <li><strong>🧭 COOKIE COMPASS</strong></li>
        </ul>
        <ul id="user-info" hidden>
          <li>
            <details class="dropdown">
              <summary><span id="user-email"></span></summary>
              <ul>
                <li><a href="#" id="logout-btn">Cerrar Sesión</a></li>
              </ul>
            </details>
          </li>
        </ul>
      </nav>

      <section id="table-editor">
        <div
          id="view-toggle"
          role="tablist"
          aria-label="Secciones administrativas"
        >
          <button
            type="button"
            id="tab-database"
            role="tab"
            data-view-mode="table"
            aria-controls="table-view"
            aria-selected="true"
          >
            Base de datos
          </button>
          <button
            type="button"
            id="tab-sales"
            role="tab"
            data-view-mode="chart"
            aria-controls="chart-view"
            aria-selected="false"
            tabindex="-1"
          >
            Gráfico de ventas
          </button>
          <button
            type="button"
            id="tab-frequency"
            role="tab"
            data-view-mode="frequency"
            aria-controls="frequency-view"
            aria-selected="false"
            tabindex="-1"
          >
            Frecuencia de clientes
          </button>
        </div>

        <section id="table-view" role="tabpanel" aria-labelledby="tab-database">
          <div id="table-view-switcher">
            <div id="table-toolbar" aria-label="Selección de tabla y acciones">
              <select
                name="selector-tabla"
                aria-label="Seleccionar tabla"
                required
                id="table-selector"
              ></select>
              <div id="table-controls-top">
                <action-menu></action-menu>
              </div>
            </div>
          </div>

          <div id="table-controls">
            <div id="table-controls-bottom">
              <filter-form id="filter-form"></filter-form>
            </div>
          </div>

          <section id="table-container"></section>
          <button id="btn-export-csv">Exportar como CSV</button>
        </section>

        <section
          id="chart-view"
          role="tabpanel"
          aria-labelledby="tab-sales"
          hidden
        >
          <div id="sales-chart-controls">
            <label for="sales-chart-month">
              Mes
              <select id="sales-chart-month" name="sales-chart-month">
                <option value="0">Enero</option>
                <option value="1">Febrero</option>
                <option value="2">Marzo</option>
                <option value="3">Abril</option>
                <option value="4">Mayo</option>
                <option value="5">Junio</option>
                <option value="6">Julio</option>
                <option value="7">Agosto</option>
                <option value="8">Septiembre</option>
                <option value="9">Octubre</option>
                <option value="10">Noviembre</option>
                <option value="11">Diciembre</option>
              </select>
            </label>
            <label for="sales-chart-year">
              Año
              <select id="sales-chart-year" name="sales-chart-year"></select>
            </label>
            <label for="sales-chart-all-year">
              Ver todo el año
              <input
                type="checkbox"
                role="switch"
                id="sales-chart-all-year"
                name="sales-chart-all-year"
              />
            </label>
          </div>

          <sales-chart-view id="sales-chart-view"></sales-chart-view>
        </section>

        <section
          id="frequency-view"
          role="tabpanel"
          aria-labelledby="tab-frequency"
          hidden
        >
          <customer-frequency-view
            id="customer-frequency-view"
          ></customer-frequency-view>
        </section>

        <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
      </section>
    </main>

    <modal-new-record id="new-record-modal"></modal-new-record>
    <modal-preview-export-csv
      id="preview-export-csv-dialog"
    ></modal-preview-export-csv>
    <confirm-dialog id="confirm-dialog"></confirm-dialog>
    <alert-dialog id="alert-dialog"></alert-dialog>

    <script type="module" src="./src/js/index.js"></script>
  </body>
</html>
