<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Cookie Compass - Gestión</title>
    <meta name="description" content="Sistema de gestión Cookie Compass" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body class="container">
    <nav>
      <ul>
        <li><strong>🧭 COOKIE COMPASS</strong></li>
      </ul>
      <ul>
        <li><a href="#">Iniciar sesión</a></li>
      </ul>
    </nav>

    <main>
      <section id="table-editor">
        <div id="table-controls">
          <div id="table-controls-top">
            <select
              name="selector-tabla"
              aria-label="Seleccionar tabla"
              required
              id="table-selector"
            ></select>
          </div>
          <div id="table-controls-bottom">
            <filter-form id="filter-form"></filter-form>
          </div>
        </div>

        <section id="table-container"></section>
      </section>
    </main>

    <button id="btn-export-csv">Exportar a CSV</button>

    <modal-new-record id="new-record-modal"></modal-new-record>
    <modal-preview-export-csv
      id="preview-export-csv-dialog"
    ></modal-preview-export-csv>
    <confirm-dialog id="confirm-dialog"></confirm-dialog>
    <alert-dialog id="alert-dialog"></alert-dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./src/js/index.js"></script>
  </body>
</html>
