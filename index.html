<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Cookie Compass - Gestión</title>
    <meta name="description" content="Sistema de gestión Cookie Compass" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/pico/pico.min.css" />
    <link rel="stylesheet" href="./css/custom.css" />
  </head>
  <body class="container">
    <nav>
      <ul>
        <li><strong>🧭 COOKIE COMPASS</strong></li>
      </ul>
      <ul>
        <li><a href="#" role="button" class="outline">Iniciar sesión</a></li>
      </ul>
    </nav>

    <main>
      <section id="table-editor">
        <div id="table-controls" style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
          <select
            name="selector-tabla"
            aria-label="Seleccionar tabla"
            required
            id="table-selector"
            style="margin-bottom: 0; max-width: 300px;"
          ></select>
        </div>

        <section id="table-container"></section>
      </section>
    </main>

    <modal-new-record id="new-record-modal"></modal-new-record>
    <div id="modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
