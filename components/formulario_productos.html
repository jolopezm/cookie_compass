<dialog open>
  <article>
    <header>
      <button aria-label="Close" rel="prev" id="btn-cerrar-modal"></button>
      <p>
        <strong>Nuevo producto</strong>
      </p>
    </header>
    <form id="form">
      <fieldset>
        <label>Nombre:</label>
        <input type="text" id="input-nombre" name="producto" required></input>
    
        <label>Precio:</label>
        <input type="text" id="input-precio" name="precio" required></input>
      </fieldset>
      <input type="submit" id="btn-guardar" value="Guardar"></input>
    </form>
  </article>
</dialog>
